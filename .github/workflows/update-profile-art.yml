name: Update Profile SVGs & Heatmap

on:
  schedule:
    # Run every day at 00:00 UTC (05:30 IST)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch Latest Contribution Data
        env:
          GH_PROFILE_USER: anirudhadg04
        run: |
          python scripts/fetch_contributions.py

      - name: Render Animated Heatmap & Stats
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
          python scripts/render_project_cards.py

      - name: Commit and Push Updated Profile SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(art): refresh daily contribution heatmap & stats [skip ci]"
          file_pattern: "contrib-heatmap.svg stats.svg data/contributions.json cards/*.svg"
