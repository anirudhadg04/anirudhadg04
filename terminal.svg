<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="610" viewBox="0 0 900 610" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
<style>
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .cursor { animation: blink 1s infinite; fill: #39d353; }
  .cursor-blue { animation: blink 1s infinite; fill: #58a6ff; }
  .term-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .prompt-user { fill: #58a6ff; font-weight: 700; }
  .prompt-at { fill: #6e7681; }
  .prompt-host { fill: #79c0ff; }
  .prompt-path { fill: #38bdf8; font-weight: 700; }
  .prompt-cmd { fill: #f0f6fc; font-weight: 600; }
  .proj-link { fill: #58a6ff; font-weight: 700; text-decoration: underline; }
  .proj-link:hover { fill: #79c0ff; }
  .proj-badge { fill: #e3b341; font-size: 11px; }
  .desc-txt { fill: #8b949e; font-size: 11.5px; }
  .val-txt { fill: #c9d1d9; font-size: 11.5px; }
  .key-txt { fill: #38bdf8; font-weight: 600; font-size: 11.5px; }
  .bullet { fill: #39d353; }
</style>
<defs>
  <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a101d" />
    <stop offset="100%" stop-color="#060a13" />
  </linearGradient>
  <linearGradient id="boxBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0c1424" stop-opacity="0.6" />
    <stop offset="100%" stop-color="#080d19" stop-opacity="0.8" />
  </linearGradient>
  <clipPath id="typingClip">
    <rect x="325" y="118" width="0" height="24">
      <animate attributeName="width" from="0" to="545" dur="2.2s" fill="freeze" begin="0.2s" />
    </rect>
  </clipPath>
</defs>

<!-- Window Frame -->
<rect width="900" height="610" rx="12" fill="url(#termBg)" />
<rect x="0.5" y="0.5" width="899" height="609" rx="12" fill="none" stroke="#1d355d" stroke-width="1.5" />

<!-- Title Bar -->
<line x1="0" y1="36" x2="900" y2="36" stroke="#162744" stroke-width="1" />
<circle cx="22" cy="18" r="5" fill="#ff5f56" />
<circle cx="38" cy="18" r="5" fill="#ffbd2e" />
<circle cx="54" cy="18" r="5" fill="#27c93f" />
<text x="450.0" y="22" fill="#6e88ab" font-size="12" text-anchor="middle" class="term-text">anirudha@dev: ~ (portfolio)</text>

<!-- Left Column: Dashed Box with exact placeholder [ Add ASCII picture here ] -->
<rect x="24" y="54" width="280" height="532" rx="6" fill="url(#boxBg)" stroke="#26477d" stroke-dasharray="6 6" stroke-width="1.2" />
<g class="term-text" text-anchor="middle" letter-spacing="1">
  <text x="164" y="312" fill="#6e88ab" font-size="14" font-weight="600">[ Add ASCII</text>
  <text x="164" y="334" fill="#6e88ab" font-size="14" font-weight="600">picture here ]</text>
</g>

<!-- Right Column: Single Cohesive Terminal Interface -->
<g class="term-text">

  <!-- Section 1: whoami -->
  <text x="325" y="74" font-size="12.5">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-at">:~$ </tspan>
    <tspan class="prompt-cmd">whoami</tspan>
  </text>
  <text x="325" y="98" fill="#58a6ff" font-size="22" font-weight="800" letter-spacing="0.5">Anirudha DG</text>
  <text x="325" y="116" fill="#c9d1d9" font-size="12.5" font-weight="500">Student &amp; Developer</text>
  
  <!-- Animated Typing Introduction -->
  <g clip-path="url(#typingClip)">
    <text x="325" y="136" fill="#38bdf8" font-size="11.5" font-weight="600">&gt; Exploring Web Application Security Testing &amp; Software Security</text>
  </g>

  <!-- Section 2: cat about.txt -->
  <text x="325" y="166" font-size="12.5">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-at">:~$ </tspan>
    <tspan class="prompt-cmd">cat about.txt</tspan>
  </text>
  <text x="325" y="185" class="val-txt">Student and developer studying software architecture, systems</text>
  <text x="325" y="200" class="val-txt">interaction, and security boundaries. Focused on web application</text>
  <text x="325" y="215" class="val-txt">security, vulnerability research, and exploit mechanics through CTF</text>
  <text x="325" y="230" class="val-txt">challenges, personal projects, and intentionally vulnerable labs.</text>

  <!-- Section 3: ls projects -->
  <text x="325" y="258" font-size="12.5">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-at">:~$ </tspan>
    <tspan class="prompt-cmd">ls ~/projects</tspan>
  </text>
  
  <!-- Project 1: SecureBox -->
  <text x="325" y="277" font-size="12">
    <tspan class="bullet">&#x25b8; </tspan>
    <a href="https://github.com/anirudhadg04/SecureBox" xlink:href="https://github.com/anirudhadg04/SecureBox" target="_blank" class="proj-link">SecureBox</a>
    <tspan class="proj-badge"> [in dev]</tspan>
  </text>
  <text x="339" y="292" class="desc-txt">Client-side document encryption (AES-256-GCM / SHA-256 integrity)</text>

  <!-- Project 2: VerySecureWebsite -->
  <text x="325" y="311" font-size="12">
    <tspan class="bullet">&#x25b8; </tspan>
    <a href="https://github.com/anirudhadg04/VerySecureWebsite" xlink:href="https://github.com/anirudhadg04/VerySecureWebsite" target="_blank" class="proj-link">VerySecureWebsite</a>
    <tspan class="proj-badge"> [in dev]</tspan>
  </text>
  <text x="339" y="326" class="desc-txt">Intentionally vulnerable app for studying BOLA/IDOR, BFLA, XSS &amp; Pytest</text>

  <!-- Project 3: tabzero -->
  <text x="325" y="345" font-size="12">
    <tspan class="bullet">&#x25b8; </tspan>
    <a href="https://github.com/anirudhadg04/tabzero" xlink:href="https://github.com/anirudhadg04/tabzero" target="_blank" class="proj-link">tabzero</a>
    <tspan fill="#39d353" font-size="11px"> [hackathon]</tspan>
  </text>
  <text x="339" y="360" class="desc-txt">Cross-platform digital wellness tool (Manifest V3 + Android app)</text>

  <!-- Project 4: Vachana -->
  <text x="325" y="379" font-size="12">
    <tspan class="bullet">&#x25b8; </tspan>
    <a href="https://github.com/anirudhadg04" xlink:href="https://github.com/anirudhadg04" target="_blank" class="proj-link">Vachana</a>
    <tspan class="proj-badge"> [in dev]</tspan>
  </text>
  <text x="339" y="394" class="desc-txt">Solo, voice-first computational exploration of Vachana literature</text>

  <!-- Section 4: cat toolkit.txt -->
  <text x="325" y="422" font-size="12.5">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-at">:~$ </tspan>
    <tspan class="prompt-cmd">cat toolkit.txt</tspan>
  </text>
  <text x="325" y="440" font-size="11.5">
    <tspan class="key-txt">Languages:  </tspan><tspan class="val-txt">Python, C / C++, TypeScript, SQL</tspan>
  </text>
  <text x="325" y="456" font-size="11.5">
    <tspan class="key-txt">Security:   </tspan><tspan class="val-txt">Kali Linux, Burp Suite, Wireshark, Nmap, OWASP Top 10</tspan>
  </text>
  <text x="325" y="472" font-size="11.5">
    <tspan class="key-txt">Web &amp; Sys:  </tspan><tspan class="val-txt">Web Crypto API, REST APIs, Linux systems</tspan>
  </text>

  <!-- Section 5: contact list -->
  <text x="325" y="500" font-size="12.5">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-at">:~$ </tspan>
    <tspan class="prompt-cmd">contact --list</tspan>
  </text>
  <text x="325" y="519" font-size="11.5">
    <tspan class="key-txt">GitHub:     </tspan>
    <a href="https://github.com/anirudhadg04" xlink:href="https://github.com/anirudhadg04" target="_blank" class="proj-link">https://github.com/anirudhadg04</a>
  </text>
  <text x="325" y="535" font-size="11.5">
    <tspan class="key-txt">Email:      </tspan>
    <a href="mailto:anirudhaworks365@gmail.com" xlink:href="mailto:anirudhaworks365@gmail.com" class="proj-link">anirudhaworks365@gmail.com</a>
  </text>

  <!-- Bottom Divider Line -->
  <line x1="325" y1="554" x2="865" y2="554" stroke="#1d355d" stroke-width="1.2" />

  <!-- Final active prompt and Closing Motto -->
  <text x="325" y="574" font-size="12.5">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-at">:~$ </tspan>
    <tspan class="cursor">&#x2588;</tspan>
  </text>
  <text x="865" y="574" fill="#60a5fa" font-size="12.5" font-style="italic" font-weight="500" text-anchor="end">“Build  &#8226;  Learn  &#8226;  Secure”</text>

</g>

</svg>