urity Lab Methodologies</tspan></text><text x="26" y="265" font-size="12.5"><tspan fill="#38bdf8" font-weight="700">Languages:   </tspan><tspan fill="#c9d1d9"> Python, C, TypeScript, SQL</tspan></text><text x="26" y="283" font-size="12.5"><tspan fill="#38bdf8" font-weight="700">Security:    </tspan><tspan fill="#c9d1d9"> Burp Suite, Wireshark, Nmap, Kali Linux</tspan></text><text x="26" y="301" font-size="12.5"><tspan fill="#38bdf8" font-weight="700">Frameworks:  </tspan><tspan fill="#c9d1d9"> OWASP Top 10 Methodology, Web Crypto API</tspan></text><text x="26" y="319" font-size="12.5"><tspan fill="#38bdf8" font-weight="700">Contact:     </tspan><tspan fill="#c9d1d9"> anirudhaworks365@gmail.com</tspan></text><circle cx="32" cy="343" r="4" fill="#ff5f56" /><circle cx="52" cy="343" r="4" fill="#ffbd2e" /><circle cx="72" cy="343" r="4" fill="#27c93f" /><circle cx="92" cy="343" r="4" fill="#58a6ff" /><circle cx="112" cy="343" r="4" fill="#bc8cff" /><circle cx="132" cy="343" r="4" fill="#ff79c6" /><circle cx="152" cy="343" r="4" fill="#39d353" /><circle cx="172" cy="343" r="4" fill="#79c0ff" /><text x="26" y="366" font-size="13"><tspan fill="#58a6ff">anirudha</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#79c0ff">github</tspan><tspan fill="#6e7681">:~$ </tspan><tspan fill="#f0f6fc">./projects.sh --list</tspan></text><text x="26" y="387" font-size="12.5"><tspan fill="#39d353">&#x25b8; </tspan><tspan fill="#f0f6fc" font-weight="700">SecureBox </tspan><tspan fill="#e3b341">[in development]</tspan> <tspan fill="#6e7681">(https://github.com/anirudhadg04/SecureBox)</tspan></text><text x="42" y="403" fill="#8b949e" font-size="11.5">Client-side document encryption &amp; archive containers using Web Crypto AES-256-GCM &amp; SHA-256.</text><text x="26" y="424" font-size="12.5"><tspan fill="#39d353">&#x25b8; </tspan><tspan fill="#f0f6fc" font-weight="700">VerySecureWebsite </tspan><tspan fill="#e3b341">[in development]</tspan> <tspan fill="#6e7681">(https://github.com/anirudhadg04/VerySecureWebsite)</tspan></text><text x="42" y="440" fill="#8b949e" font-size="11.5">Intentionally vulnerable educational lab for learning AppSec (BOLA/IDOR, BFLA, XSS) with Pytest.</text><text x="26" y="461" font-size="12.5"><tspan fill="#39d353">&#x25b8; </tspan><tspan fill="#f0f6fc" font-weight="700">tabzero </tspan><tspan fill="#39d353">[hackathon]</tspan> <tspan fill="#6e7681">(https://github.com/anirudhadg04/tabzero)</tspan></text><text x="42" y="477" fill="#8b949e" font-size="11.5">Digital wellness ecosystem built with @NyNehalJois (Manifest V3 Extension + Android App).</text><text x="26" y="498" font-size="12.5"><tspan fill="#39d353">&#x25b8; </tspan><tspan fill="#f0f6fc" font-weight="700">Vachana </tspan><tspan fill="#bc8cff">[in development]</tspan></text><text x="42" y="514" fill="#8b949e" font-size="11.5">Solo, voice-first exploration connected to Vachana literature.</text><text x="26" y="537" font-size="13"><tspan fill="#58a6ff">anirudha</tspan><tspan fill="#6e7681">@</tspan><tspan fill="#79c0ff">github</tspan><tspan fill="#6e7681">:~$ </tspan><tspan fill="#f0f6fc">palette</tspan></text><text x="26" y="555" fill="#6e7681" font-size="12">theme: </text><rect x="80" y="545" width="16" height="12" rx="2" fill="#ff5f56" /><rect x="100" y="545" width="16" height="12" rx="2" fill="#ffbd2e" /><rect x="120" y="545" width="16" height="12" rx="2" fill="#27c93f" /><rect x="140" y="545" width="16" height="12" rx="2" fill="#58a6ff" /><rect x="160" y="545" width="16" height="12" rx="2" fill="#bc8cff" /><rect x="180" y="545" width="16" height="12" rx="2" fill="#ff79c6" /><rect x="200" y="545" width="16" height="12" rx="2" fill="#f1fa8c" /><rect x="220" y="545" width="16" height="12" rx="2" fill="#38bdf8" /><rect x="240" y="545" width="16" height="12" rx="2" fill="#39d353" /><rect x="260" y="545" width="16" height="12" rx="2" fill="#f0883e" /><rect x="280" y="545" width="16" height="12" rx="2" fill="#e6edf3" /><rect x="300" y="545" width="16" height="12" rx="2" fil