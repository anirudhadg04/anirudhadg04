    <stop offset="0%" stop-color="#0a101d" />
    <stop offset="100%" stop-color="#060a13" />
  </linearGradient>
  <linearGradient id="boxBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0c1424" stop-opacity="0.6" />
    <stop offset="100%" stop-color="#080d19" stop-opacity="0.8" />
  </linearGradient>
</defs>

<!-- Window Frame -->
<rect width="880" height="430" rx="12" fill="url(#termBg)" />
