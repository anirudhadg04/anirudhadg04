<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
<style>
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .cursor { animation: blink 1s infinite; }
  .term-text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .label-hdr { fill: #38bdf8; font-weight: 700; font-size: 12.5px; }
  .proj-name { fill: #58a6ff; font-weight: 700; }
  .proj-desc { fill: #8b949e; }
  .bullet { fill: #39d353; }
  .txt-val { fill: #c9d1d9; }
</style>
<defs>
  <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a101d" />
    <stop offset="100%" stop-color="#060a13" />
  </linearGradient>
  <linearGradient id="boxBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0c1424" stop-opacity="0.6" />
    <stop offset="100%" stop-color="#080d19" stop-opacity="0.8" />
  </linearGradient>
</defs>

<!-- Window Frame -->
<rect width="880" height="450" rx="12" fill="url(#termBg)" />
<rect x="0.5" y="0.5" width="879" height="449" rx="12" fill="none" stroke="#1d355d" stroke-width="1.5" />

<!-- Title Bar -->
<line x1="0" y1="38" x2="880" y2="38" stroke="#162744" stroke-width="1" />
<circle cx="22" cy="19" r="5.5" fill="#ff5f56" />
<circle cx="40" cy="19" r="5.5" fill="#ffbd2e" />
<circle cx="58" cy="19" r="5.5" fill="#27c93f" />
<text x="440.0" y="23" fill="#6e88ab" font-size="12.5" text-anchor="middle" class="term-text">~/anirudha-dg</text>

<!-- Shell Command -->
<text x="26" y="68" font-size="13.5" class="term-text">
  <tspan fill="#60a5fa" font-weight="700">you@dev:~$</tspan> <tspan fill="#f0f6fc">neofetch</tspan>
</text>

<!-- Left Column: Dashed Box with exact placeholder [ Add ASCII picture here ] -->
<rect x="26" y="88" width="355" height="330" rx="6" fill="url(#boxBg)" stroke="#26477d" stroke-dasharray="6 6" stroke-width="1.2" />
<text x="203" y="246" fill="#6e88ab" font-size="15" font-weight="600" text-anchor="middle" class="term-text" letter-spacing="1">[ Add ASCII</text>
<text x="203" y="270" fill="#6e88ab" font-size="15" font-weight="600" text-anchor="middle" class="term-text" letter-spacing="1">picture here ]</text>

<!-- Right Column: Developer Overview -->
<g class="term-text">
  <!-- Name & Subtitle -->
  <text x="415" y="115" fill="#58a6ff" font-size="23" font-weight="800" letter-spacing="0.5">Anirudha DG</text>
  <text x="415" y="133" fill="#8b949e" font-size="12">Student &amp; Developer &#183; Security Researcher</text>

  <!-- Section 1: Security Focus -->
  <text x="415" y="162" class="label-hdr">~/security-focus</text>
  <text x="415" y="180" font-size="11.5">
    <tspan class="bullet">&#x25b8; </tspan><tspan fill="#f0f6fc">Web Application Security &amp; Software Security</tspan>
  </text>
  <text x="427" y="196" font-size="11" fill="#8b949e">Vulnerability research, exploit mechanics &amp; defensive verification</text>

  <!-- Section 2: Selected Projects -->
  <text x="415" y="226" class="label-hdr">~/projects</text>
  
  <text x="415" y="245" font-size="11.5">
    <tspan class="bullet">&#x25b8; </tspan><tspan class="proj-name">SecureBox</tspan><tspan fill="#6e7681"> &#8212; </tspan><tspan class="proj-desc">Client-side AES-256-GCM encryption &amp; archives</tspan>
  </text>
  <text x="415" y="264" font-size="11.5">
    <tspan class="bullet">&#x25b8; </tspan><tspan class="proj-name">VerySecureWebsite</tspan><tspan fill="#6e7681"> &#8212; </tspan><tspan class="proj-desc">AppSec lab (BOLA, BFLA, XSS) with Pytest</tspan>
  </text>
  <text x="415" y="283" font-size="11.5">
    <tspan class="bullet">&#x25b8; </tspan><tspan class="proj-name">tabzero</tspan><tspan fill="#6e7681"> &#8212; </tspan><tspan class="proj-desc">Digital wellness (Manifest V3 + Android app)</tspan>
  </text>
  <text x="415" y="302" font-size="11.5">
    <tspan class="bullet">&#x25b8; </tspan><tspan class="proj-name">Vachana</tspan><tspan fill="#6e7681"> &#8212; </tspan><tspan class="proj-desc">Voice-first computational literary exploration</tspan>
  </text>

  <!-- Section 3: Toolkit -->
  <text x="415" y="332" class="label-hdr">~/toolkit</text>
  <text x="415" y="351" font-size="11.5">
    <tspan class="bullet">&#x25b8; </tspan><tspan fill="#38bdf8">Security:</tspan><tspan class="txt-val"> Kali Linux, Burp Suite, Wireshark, Nmap, OWASP</tspan>
  </text>
  <text x="415" y="369" font-size="11.5">
    <tspan class="bullet">&#x25b8; </tspan><tspan fill="#38bdf8">Dev:</tspan><tspan class="txt-val">      Python, C, TypeScript, SQL, Web Crypto API</tspan>
  </text>

  <!-- Divider Line -->
  <line x1="415" y1="393" x2="855" y2="393" stroke="#1d355d" stroke-width="1.2" />

  <!-- Closing Line -->
  <text x="415" y="418" fill="#60a5fa" font-size="13.5" font-style="italic" font-weight="500">“Build  &#8226;  Learn  &#8226;  Secure”</text>
</g>

</svg>
