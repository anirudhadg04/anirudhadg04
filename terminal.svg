<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="696" viewBox="0 0 880 696" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace">
<style>
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes termFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .term-window { animation: termFadeIn 0.4s ease-out both; }
  .cursor { animation: blink 1s step-end infinite; fill: #c084fc; }
  .term-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
  .prompt-user { fill: #c084fc; font-weight: 700; }
  .prompt-at { fill: #7e6c9b; }
  .prompt-host { fill: #e9d5ff; }
  .prompt-path { fill: #a855f7; font-weight: 700; }
  .prompt-cmd { fill: #f5f3ff; font-weight: 600; }
  .proj-link { fill: #d8b4fe; font-weight: 700; text-decoration: underline; }
  .proj-link:hover { fill: #ffffff; }
  .proj-badge { fill: #e9d5ff; font-size: 12px; }
  .desc-txt { fill: #9d91b8; font-size: 12.5px; }
  .val-txt { fill: #e2ddf0; font-size: 13.5px; }
  .key-txt { fill: #c084fc; font-weight: 600; font-size: 13.5px; }
  .bullet { fill: #c084fc; }
  @media (prefers-reduced-motion: reduce) {
    .term-window { animation: none !important; opacity: 1 !important; transform: none !important; }
    #typingClip rect { width: 680px !important; }
  }
</style>
<defs>
  <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#120c22" />
    <stop offset="100%" stop-color="#090613" />
  </linearGradient>
  <radialGradient id="ambientGlow" cx="20%" cy="10%" r="65%">
    <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.10" />
    <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
  </radialGradient>
  <clipPath id="typingClip">
    <rect x="36" y="127" width="0" height="24">
      <animate attributeName="width" from="0" to="680" dur="2.2s" fill="freeze" begin="0.2s" />
    </rect>
  </clipPath>
</defs>

<!-- Window Frame -->
<g class="term-window">
<rect width="880" height="696" rx="12" fill="url(#termBg)" />
<rect width="880" height="696" rx="12" fill="url(#ambientGlow)" />
<rect x="0.5" y="0.5" width="879" height="695" rx="12" fill="none" stroke="#48326d" stroke-width="1.2" />

<!-- Title Bar -->
<line x1="0" y1="36" x2="880" y2="36" stroke="#281a44" stroke-width="1" />
<circle cx="20" cy="18" r="5" fill="#ff5f56" />
<circle cx="36" cy="18" r="5" fill="#ffbd2e" />
<circle cx="52" cy="18" r="5" fill="#27c93f" />
<text x="440.0" y="22" fill="#a998c9" font-size="12.5" text-anchor="middle" class="term-text">anirudha@dev: ~ (portfolio)</text>

<g class="term-text">
  <!-- Section 1: whoami -->
  <text x="36" y="68" font-size="14">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-path">:~$ </tspan>
    <tspan class="prompt-cmd">whoami</tspan>
  </text>
  <text x="36" y="98" fill="#f3e8ff" font-size="25" font-weight="800" letter-spacing="0.5">Anirudha DG</text>
  <text x="36" y="120" fill="#c4b5fd" font-size="14" font-weight="500">Student &amp; Developer</text>
  
  <!-- Animated Typing Introduction -->
  <g clip-path="url(#typingClip)">
    <text x="36" y="142" fill="#a78bfa" font-size="13.5" font-weight="600">&gt; Exploring Web Application Security Testing &amp; Software Security</text>
  </g>

  <!-- Section 2: cat about.txt -->
  <text x="36" y="178" font-size="14">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-path">:~$ </tspan>
    <tspan class="prompt-cmd">cat about.txt</tspan>
  </text>
  <text x="36" y="200" class="val-txt">Student and developer studying software architecture, systems</text>
  <text x="36" y="219" class="val-txt">interaction, and security boundaries. Focused on web application</text>
  <text x="36" y="238" class="val-txt">security, vulnerability research, and exploit mechanics through CTF</text>
  <text x="36" y="257" class="val-txt">challenges, personal projects, and intentionally vulnerable labs.</text>

  <!-- Section 3: ls ~/projects -->
  <text x="36" y="290" font-size="14">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-path">:~$ </tspan>
    <tspan class="prompt-cmd">ls ~/projects</tspan>
  </text>
  
  <!-- Project 1: SecureBox -->
  <text x="36" y="312" font-size="14">
    <tspan class="bullet">&#x25b8; </tspan>
    <a href="https://github.com/anirudhadg04/SecureBox" xlink:href="https://github.com/anirudhadg04/SecureBox" target="_blank" class="proj-link">SecureBox</a>
    <tspan class="proj-badge"> [in dev]</tspan>
  </text>
  <text x="54" y="330" class="desc-txt">Client-side document encryption (AES-256-GCM / SHA-256 integrity)</text>

  <!-- Project 2: VerySecureWebsite -->
  <text x="36" y="352" font-size="14">
    <tspan class="bullet">&#x25b8; </tspan>
    <a href="https://github.com/anirudhadg04/VerySecureWebsite" xlink:href="https://github.com/anirudhadg04/VerySecureWebsite" target="_blank" class="proj-link">VerySecureWebsite</a>
    <tspan class="proj-badge"> [in dev]</tspan>
  </text>
  <text x="54" y="370" class="desc-txt">Intentionally vulnerable app for studying BOLA/IDOR, BFLA, XSS &amp; Pytest</text>

  <!-- Project 3: tabzero -->
  <text x="36" y="392" font-size="14">
    <tspan class="bullet">&#x25b8; </tspan>
    <a href="https://github.com/anirudhadg04/tabzero" xlink:href="https://github.com/anirudhadg04/tabzero" target="_blank" class="proj-link">tabzero</a>
    <tspan fill="#34d399" font-size="12px" font-weight="600"> [hackathon]</tspan>
  </text>
  <text x="54" y="410" class="desc-txt">Cross-platform digital wellness tool (Manifest V3 + Android app)</text>

  <!-- Project 4: Vachana -->
  <text x="36" y="432" font-size="14">
    <tspan class="bullet">&#x25b8; </tspan>
    <a href="https://github.com/anirudhadg04" xlink:href="https://github.com/anirudhadg04" target="_blank" class="proj-link">Vachana</a>
    <tspan class="proj-badge"> [in dev]</tspan>
  </text>
  <text x="54" y="450" class="desc-txt">Solo, voice-first computational exploration of Vachana literature</text>

  <!-- Section 4: cat toolkit.txt -->
  <text x="36" y="484" font-size="14">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-path">:~$ </tspan>
    <tspan class="prompt-cmd">cat toolkit.txt</tspan>
  </text>
  <text x="36" y="506" font-size="13.5">
    <tspan class="key-txt">Languages:  </tspan><tspan class="val-txt">Python, C, TypeScript, SQL</tspan>
  </text>
  <text x="36" y="526" font-size="13.5">
    <tspan class="key-txt">Security:   </tspan><tspan class="val-txt">Kali Linux, Burp Suite, Wireshark, Nmap, OWASP Top 10</tspan>
  </text>

  <!-- Section 5: contact list -->
  <text x="36" y="580" font-size="14">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-path">:~$ </tspan>
    <tspan class="prompt-cmd">contact --list</tspan>
  </text>
  <text x="36" y="602" font-size="13.5">
    <tspan class="key-txt">GitHub:     </tspan>
    <a href="https://github.com/anirudhadg04" target="_blank" class="proj-link">https://github.com/anirudhadg04</a>
  </text>
  <text x="36" y="622" font-size="13.5">
    <tspan class="key-txt">Email:      </tspan>
    <a href="mailto:anirudhaworks365@gmail.com" class="proj-link">anirudhaworks365@gmail.com</a>
  </text>

  <!-- Bottom Divider Line -->
  <line x1="36" y1="644" x2="844" y2="644" stroke="#342252" stroke-width="1.2" />

  <!-- Final active prompt without motto -->
  <text x="36" y="668" font-size="14">
    <tspan class="prompt-user">anirudha</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">dev</tspan><tspan class="prompt-path">:~$ </tspan>
    <tspan class="cursor">&#x2588;<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.5;0.99;1" dur="1s" repeatCount="indefinite" /></tspan>
  </text>

</g>
</g>
</svg>